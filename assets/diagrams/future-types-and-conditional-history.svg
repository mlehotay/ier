<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img" aria-labelledby="title desc">
  <title id="title">Future types and conditional history</title>
  <desc id="desc">Current physical frontier leads to Admissible physical successors; Current physical frontier leads to Anticipated planned or imagined futures; Admissible physical successors leads to Actual lawful continuation; Actual lawful continuation leads to Later physical frontier; Admissible physical successors leads to Conditional atomic foreclosure; Conditional atomic foreclosure leads to Welding incorporates deformation; Welding incorporates deformation leads to Propagation redistributes consequences; Propagation redistributes consequences leads to Stabilized inheritance: sedimentation; Stabilized inheritance: sedimentation leads to Later physical frontier; Anticipated planned or imagined futures leads to Present cognitive organization can participate and bind; Present cognitive organization can participate and bind leads to Current physical frontier.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#374151"/></marker>
  </defs>
  <rect width="1000" height="950" fill="white"/>

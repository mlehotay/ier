  <polyline points="490.0,394 490.0,440" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="490.0,524 490.0,570" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="490.0,654 490.0,700" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="490.0,784 490,872 280,872.0" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="820.0,264 820.0,310" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <polyline points="940,352.0 970,352 970,20 160,20 160.0,50" fill="none" stroke="#374151" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <rect x="40" y="50" width="240" height="84" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="160" y="92" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">Current physical frontier</text>
<rect x="40" y="180" width="240" height="84" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="160" y="211" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">Admissible physical</text>
  <text x="160" y="233" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">successors</text>
<rect x="40" y="310" width="240" height="84" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="160" y="341" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">Actual lawful</text>
  <text x="160" y="363" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">continuation</text>
<rect x="40" y="830" width="240" height="84" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="160" y="872" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">Later physical frontier</text>
<rect x="370" y="310" width="240" height="84" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="490" y="341" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">Conditional atomic</text>
  <text x="490" y="363" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">foreclosure</text>
<rect x="370" y="440" width="240" height="84" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="490" y="471" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">Welding incorporates</text>
  <text x="490" y="493" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">deformation</text>
<rect x="370" y="570" width="240" height="84" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="490" y="601" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">Propagation redistributes</text>
  <text x="490" y="623" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">consequences</text>
<rect x="370" y="700" width="240" height="84" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="490" y="731" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">Stabilized inheritance:</text>
  <text x="490" y="753" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">sedimentation</text>
<rect x="700" y="180" width="240" height="84" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="820" y="211" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">Anticipated planned or</text>
  <text x="820" y="233" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">imagined futures</text>
<rect x="700" y="310" width="240" height="84" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="820" y="330" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">Present cognitive</text>
  <text x="820" y="352" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">organization can</text>
  <text x="820" y="374" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="16" fill="#111827">participate and bind</text>
</svg>

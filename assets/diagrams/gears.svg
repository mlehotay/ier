  <title id="title">Three interlocking gears</title>
  <desc id="desc">Equal gears mesh in a line. Gear 2 is offset by half a tooth so each tooth enters the adjacent gap. Gears 1 and 3 turn in the same direction; Gear 2 turns in the opposite direction.</desc>
